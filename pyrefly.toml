# Each example under `examples/` has its own pyrefly.toml so their local `model`
# packages don't collide on a shared search-path. Run pyrefly from inside each
# example to check it.
project-excludes = [".venv", "**/__pycache__", "examples/southwest-tsa"]
search-path = ["src"]
strict-callable-subtyping = true

[errors]
implicit-any = true
