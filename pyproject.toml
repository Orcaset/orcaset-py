[project]
name = "orcaset"
version = "0.14.0"
description = "Financial models in Python"
readme = "README.md"
license = "SSPL-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "types-python-dateutil>=2.9.0.20260508",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

# Examples with their own dependencies are workspace members that build against
# this checkout of orcaset rather than a released version.
[tool.uv.workspace]
members = [
    "examples/cre-office",
    "examples/multifamily",
    "examples/paper-lbo",
    "examples/web-scraping",
]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.0.3",
]
